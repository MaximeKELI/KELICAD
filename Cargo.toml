[workspace]
resolver = "2"
members = [
    "crates/kelicad-math",
    "crates/kelicad-geom",
    "crates/kelicad-doc",
    "crates/kelicad-ops",
    "crates/kelicad-snap",
    "crates/kelicad-cmd",
    "crates/kelicad-io",
    "crates/kelicad-ai",
    "crates/kelicad-sync",
    "crates/kelicad-plugin",
    "crates/kelicad-constraints",
    "crates/kelicad-vectorize",
    "crates/kelicad-solid",
    "crates/kelicad-bim",
    "crates/kelicad-dwg",
    "crates/kelicad-audit",
    "crates/kelicad-wasm",
    "services/gateway",
    "apps/cli",
    "apps/dwg-worker",
    "sdk/rust",
]
default-members = [
    "crates/kelicad-math",
    "crates/kelicad-geom",
    "crates/kelicad-doc",
    "crates/kelicad-ops",
    "crates/kelicad-snap",
    "crates/kelicad-cmd",
    "crates/kelicad-io",
    "crates/kelicad-ai",
    "crates/kelicad-sync",
    "crates/kelicad-plugin",
    "crates/kelicad-constraints",
    "crates/kelicad-vectorize",
    "crates/kelicad-solid",
    "crates/kelicad-bim",
    "crates/kelicad-dwg",
    "crates/kelicad-audit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kelicad/kelicad"
rust-version = "1.75"

[workspace.dependencies]
kelicad-math = { path = "crates/kelicad-math" }
kelicad-geom = { path = "crates/kelicad-geom" }
kelicad-doc = { path = "crates/kelicad-doc" }
kelicad-ops = { path = "crates/kelicad-ops" }
kelicad-snap = { path = "crates/kelicad-snap" }
kelicad-cmd = { path = "crates/kelicad-cmd" }
kelicad-io = { path = "crates/kelicad-io" }
kelicad-ai = { path = "crates/kelicad-ai" }
kelicad-sync = { path = "crates/kelicad-sync" }
kelicad-plugin = { path = "crates/kelicad-plugin" }
kelicad-constraints = { path = "crates/kelicad-constraints" }
kelicad-vectorize = { path = "crates/kelicad-vectorize" }
kelicad-solid = { path = "crates/kelicad-solid" }
kelicad-bim = { path = "crates/kelicad-bim" }
kelicad-dwg = { path = "crates/kelicad-dwg" }
kelicad-audit = { path = "crates/kelicad-audit" }
clap = { version = "4.5.21", features = ["derive"] }
jsonwebtoken = "9.3.0"
sha2 = "0.10.8"
hex = "0.4.3"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
axum = { version = "0.7.9", features = ["ws"] }
tokio = { version = "1.41.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower-http = { version = "0.6.2", features = ["cors"] }
futures-util = "0.3.31"
uuid = { version = "1.11.0", features = ["v7", "serde", "js"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
thiserror = "2.0.3"
proptest = "1.5.0"
wasm-bindgen = "0.2.99"
console_error_panic_hook = "0.1.7"
rusqlite = { version = "0.32.1", features = ["bundled"] }
printpdf = "0.7.0"

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
lto = true
