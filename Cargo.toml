[workspace]
resolver = "2"
members = [
    "crates/kelicad-math",
    "crates/kelicad-geom",
    "crates/kelicad-doc",
    "crates/kelicad-ops",
    "crates/kelicad-snap",
    "crates/kelicad-cmd",
    "crates/kelicad-io",
    "crates/kelicad-wasm",
]
default-members = [
    "crates/kelicad-math",
    "crates/kelicad-geom",
    "crates/kelicad-doc",
    "crates/kelicad-ops",
    "crates/kelicad-snap",
    "crates/kelicad-cmd",
    "crates/kelicad-io",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kelicad/kelicad"
rust-version = "1.75"

[workspace.dependencies]
kelicad-math = { path = "crates/kelicad-math" }
kelicad-geom = { path = "crates/kelicad-geom" }
kelicad-doc = { path = "crates/kelicad-doc" }
kelicad-ops = { path = "crates/kelicad-ops" }
kelicad-snap = { path = "crates/kelicad-snap" }
kelicad-cmd = { path = "crates/kelicad-cmd" }
kelicad-io = { path = "crates/kelicad-io" }
uuid = { version = "1.11.0", features = ["v7", "serde", "js"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
thiserror = "2.0.3"
proptest = "1.5.0"
wasm-bindgen = "0.2.99"
console_error_panic_hook = "0.1.7"
rusqlite = { version = "0.32.1", features = ["bundled"] }
printpdf = "0.7.0"

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
lto = true
