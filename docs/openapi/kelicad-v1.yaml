openapi: 3.0.3
info:
  title: KELICAD Collaboration API
  version: 0.1.0
  description: REST surface for rooms, snapshots, ops, and vectorize (M5/M6).
servers:
  - url: http://127.0.0.1:8787
paths:
  /v1/health:
    get:
      summary: Liveness
      responses:
        "200":
          description: OK
  /v1/rooms:
    post:
      summary: Create a collaboration room
      responses:
        "200":
          description: Room created
          content:
            application/json:
              schema:
                type: object
                properties:
                  room_id:
                    type: string
                  ws_url:
                    type: string
  /v1/rooms/{id}/snapshot:
    get:
      summary: Fetch room oplog snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Snapshot
        "404":
          description: Unknown room
  /v1/rooms/{id}/ops:
    post:
      summary: Append an operation envelope
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                envelope:
                  type: object
      responses:
        "200":
          description: Accepted
        "404":
          description: Unknown room
  /v1/vectorize:
    post:
      summary: Deterministic SVG/PNG → editable geometries
      parameters:
        - name: filename
          in: query
          required: false
          schema:
            type: string
            example: plan.svg
      requestBody:
        required: true
        content:
          image/svg+xml:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Geometries extracted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  count:
                    type: integer
                  entities:
                    type: array
                    items:
                      type: object
        "400":
          description: Unsupported or empty input
