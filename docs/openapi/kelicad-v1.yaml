openapi: 3.0.3
info:
  title: KELICAD Collaboration API
  version: 0.1.0
  description: Rooms, snapshots, ops, vectorize, auth, audit, GDPR (M5–M8).
servers:
  - url: http://127.0.0.1:8787
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      security: []
      summary: Liveness
      responses:
        "200":
          description: OK
  /v1/auth/dev-token:
    post:
      security: []
      summary: Issue HS256 JWT (only when KELICAD_AUTH_MODE=dev)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sub: { type: string }
                org: { type: string }
                role: { type: string, enum: [viewer, editor, admin] }
      responses:
        "200":
          description: Token issued
        "403":
          description: Dev auth disabled
  /v1/rooms:
    post:
      summary: Create a collaboration room (editor+)
      responses:
        "200":
          description: Room created
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  /v1/rooms/{id}/snapshot:
    get:
      summary: Fetch room oplog snapshot (viewer+)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Snapshot
        "404":
          description: Unknown room
  /v1/rooms/{id}/ops:
    post:
      summary: Append an operation envelope (editor+)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                envelope:
                  type: object
      responses:
        "200":
          description: Accepted
        "403":
          description: Forbidden
  /v1/vectorize:
    post:
      summary: Deterministic SVG/PNG → geometries (editor+)
      parameters:
        - name: filename
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Geometries extracted
        "400":
          description: Bad input
  /v1/audit:
    get:
      summary: Export hash-chained audit log (admin)
      responses:
        "200":
          description: Audit events
        "403":
          description: Forbidden
  /v1/me/export:
    get:
      summary: GDPR export for JWT subject
      responses:
        "200":
          description: Subject data bundle
  /v1/me:
    delete:
      summary: GDPR delete subject profile + audit slice
      responses:
        "200":
          description: Purged
