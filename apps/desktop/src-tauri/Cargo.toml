[package]
name = "kelicad-desktop"
version = "0.1.0"
description = "KELICAD native desktop shell (Tauri 2)"
authors = ["KELICAD"]
edition = "2021"
license = "MIT"

[lib]
name = "kelicad_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { workspace = true }
serde_json = { workspace = true }
kelicad-doc = { workspace = true }
kelicad-ops = { workspace = true }
kelicad-io = { workspace = true, features = ["native"] }
kelicad-cmd = { workspace = true }
kelicad-math = { workspace = true }
uuid = { workspace = true }
